name: Start Remote Database

on:
  push:
    branches:
      - env-test
      - env-qa
      - main
  workflow_dispatch:

jobs:
  start-db:
    runs-on: self-hosted

    environment:
      name: ${{ github.ref_name }}

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      ENVIRONMENT: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostGIS
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            up -d --build

      - name: Check services
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            ps
      - name: Build Python loader
        run: |
          docker compose -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} build python

      - name: Load county and H3 grids
        run: |
          docker compose -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} run --rm --no-deps python