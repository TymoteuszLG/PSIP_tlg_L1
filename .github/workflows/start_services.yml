name: Start Remote Database

on:
  push:
    branches:
      - env-test
      - env-qa
      - main
  workflow_dispatch:

concurrency:
  group: start-services-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  start-db:
    runs-on: self-hosted

    environment:
      name: ${{ github.ref_name }}

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      ENVIRONMENT: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start PostGIS
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            up -d --build postgis

      - name: Check services
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            ps

      - name: Build Python loader
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            build python

      - name: Check BDOT source data
        if: github.ref_name == 'env-test'
        run: |
          docker volume inspect psip-bdot-3010 > /dev/null
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            run --rm --no-deps \
            -v psip-bdot-3010:/data/3010_SHP:ro \
            python python -c "from pathlib import Path; files=list(Path('/data/3010_SHP').glob('*.shp')); print('Warstwy SHP:', len(files)); assert len(files)==64, 'Brak kompletu danych BDOT'"

      - name: Load county and H3 grids
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            run --rm --no-deps \
            -e ENVIRONMENT \
            python python -u /app/load.py

      - name: Load BDOT layers
        if: github.ref_name == 'env-test'
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            run --rm --no-deps \
            -e ENVIRONMENT \
            -v psip-bdot-3010:/data/3010_SHP:ro \
            python python -u /app/python/bdot_loader.py

      - name: Aggregate BDOT into H3 grids
        if: github.ref_name == 'env-test'
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ github.ref_name }} \
            run --rm --no-deps \
            -e ENVIRONMENT \
            python python -u /app/python/bdot_aggregate.py