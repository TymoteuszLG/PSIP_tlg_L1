name: Destroy Remote Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Środowisko do usunięcia wraz z danymi"
        required: true
        type: choice
        options:
          - env-test
          - env-qa
          - main

jobs:
  destroy-db:
    runs-on: self-hosted

    environment:
      name: ${{ inputs.environment }}

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      ENVIRONMENT: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.environment }}

      - name: Destroy PostGIS resources
        run: |
          docker compose \
            -f docker-compose-remote.yml \
            -p remote-db-${{ inputs.environment }} \
            down --volumes --remove-orphans